<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 300 800;
        font-display: block;
        src: url("assets/fonts/Fraunces.woff2") format("woff2");
      }
      @font-face {
        font-family: "Space Grotesk";
        font-style: normal;
        font-weight: 300 700;
        font-display: block;
        src: url("assets/fonts/SpaceGrotesk.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0508;
        font-family: "Space Grotesk", sans-serif;
      }
      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #140a12;
      }
      #scene1 { z-index: 1; }
      #scene2 { z-index: 2; opacity: 0; }
      #scene3 { z-index: 3; opacity: 0; }
      #scene4 { z-index: 4; opacity: 0; }

      /* ---------- shared decorative layers ---------- */
      .bg-glow {
        position: absolute;
        width: 1500px;
        height: 1500px;
        left: 50%;
        top: 40%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 158, 122, 0.22) 0%,
          rgba(255, 93, 126, 0.1) 36%,
          rgba(20, 10, 18, 0) 70%
        );
      }
      .ghost {
        position: absolute;
        left: 50%;
        bottom: -150px;
        transform: translateX(-50%);
        font-family: "Fraunces", serif;
        font-weight: 800;
        font-size: 560px;
        letter-spacing: -0.05em;
        color: #f4ebe6;
        opacity: 0.045;
      }
      .topbar {
        position: absolute;
        top: 128px;
        left: 96px;
        right: 96px;
        display: flex;
        justify-content: space-between;
        font-family: "Space Grotesk", sans-serif;
        font-size: 26px;
        font-weight: 500;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #b79ba6;
      }
      .content {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        box-sizing: border-box;
        padding: 0 96px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .rule {
        width: 220px;
        height: 2px;
        background: #ff5d7e;
        transform-origin: 50% 50%;
      }

      /* ---------- scene 1 ---------- */
      #s1-eyebrow {
        font-family: "Space Grotesk", sans-serif;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #b79ba6;
      }
      #s1-num {
        font-family: "Fraunces", serif;
        font-size: 360px;
        font-weight: 800;
        line-height: 0.9;
        letter-spacing: -0.03em;
        color: #ff5d7e;
        margin-top: 24px;
      }
      #s1-word {
        font-family: "Fraunces", serif;
        font-size: 92px;
        font-weight: 300;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #f4ebe6;
      }
      #s1-rule { margin: 40px 0; }
      #s1-sub {
        font-family: "Space Grotesk", sans-serif;
        font-size: 34px;
        font-weight: 320;
        letter-spacing: 0.02em;
        color: #b79ba6;
      }

      /* ---------- scene 2 ---------- */
      #s2-kicker {
        font-family: "Space Grotesk", sans-serif;
        font-size: 32px;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #ff5d7e;
        margin-bottom: 44px;
      }
      #s2-q {
        font-family: "Fraunces", serif;
        font-size: 128px;
        font-weight: 350;
        line-height: 1.07;
        letter-spacing: -0.02em;
        color: #f4ebe6;
        max-width: 860px;
        text-align: center;
      }
      #s2-rule { margin-top: 56px; }

      /* ---------- scene 3 ---------- */
      .words {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        box-sizing: border-box;
        padding: 0 110px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 34px;
      }
      .word-row {
        display: flex;
        align-items: baseline;
        gap: 42px;
      }
      .idx {
        font-family: "Space Grotesk", sans-serif;
        font-size: 32px;
        font-weight: 500;
        letter-spacing: 0.18em;
        color: #ff5d7e;
        width: 92px;
        flex: none;
      }
      .word {
        font-family: "Fraunces", serif;
        font-size: 150px;
        font-weight: 300;
        letter-spacing: -0.02em;
        line-height: 1;
        color: #f4ebe6;
      }
      #w4 .word { color: #ff5d7e; font-weight: 500; }

      /* ---------- scene 4 ---------- */
      #s4-kicker {
        font-family: "Space Grotesk", sans-serif;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: #ff5d7e;
      }
      #s4-text {
        font-family: "Fraunces", serif;
        font-size: 104px;
        font-weight: 300;
        line-height: 1.12;
        letter-spacing: -0.02em;
        color: #f4ebe6;
        max-width: 820px;
        text-align: center;
        margin-top: 30px;
      }
      #s4-rule { margin: 48px 0; }
      #s4-foot {
        font-family: "Space Grotesk", sans-serif;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #b79ba6;
      }
      .blackout {
        position: absolute;
        inset: 0;
        background: #0a0508;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="16"
    >
      <!-- ============ SCENE 1 · opener ============ -->
      <div id="scene1" class="scene">
        <div class="bg-glow" data-layout-allow-overflow id="s1-glow"></div>
        <div class="ghost" id="s1-ghost">666</div>
        <div class="content">
          <div id="s1-eyebrow">TikTok Test Series · Eng</div>
          <div id="s1-num">666</div>
          <div id="s1-word">Questions</div>
          <div class="rule" id="s1-rule"></div>
          <div id="s1-sub">One question. Every single day.</div>
        </div>
      </div>

      <!-- ============ SCENE 2 · the question ============ -->
      <div id="scene2" class="scene">
        <div class="bg-glow" data-layout-allow-overflow id="s2-glow"></div>
        <div class="topbar">
          <span id="s2-lab">Question 01</span>
          <span id="s2-mark">666 Questions</span>
        </div>
        <div class="content">
          <div id="s2-kicker">Say it in four</div>
          <div id="s2-q">Describe love in four words.</div>
          <div class="rule" id="s2-rule"></div>
        </div>
      </div>

      <!-- ============ SCENE 3 · the four words ============ -->
      <div id="scene3" class="scene">
        <div class="bg-glow" data-layout-allow-overflow id="s3-glow"></div>
        <div class="topbar">
          <span id="s3-lab">The Answer</span>
          <span id="s3-mark">666 Questions</span>
        </div>
        <div class="words">
          <div class="word-row" id="w1"><span class="idx">01</span><span class="word">You.</span></div>
          <div class="word-row" id="w2"><span class="idx">02</span><span class="word">Me.</span></div>
          <div class="word-row" id="w3"><span class="idx">03</span><span class="word">Us.</span></div>
          <div class="word-row" id="w4"><span class="idx">04</span><span class="word">Always.</span></div>
        </div>
      </div>

      <!-- ============ SCENE 4 · CTA / outro ============ -->
      <div id="scene4" class="scene">
        <div class="bg-glow" data-layout-allow-overflow id="s4-glow"></div>
        <div class="content">
          <div id="s4-kicker">Your Turn</div>
          <div id="s4-text">Drop your four words in the comments.</div>
          <div class="rule" id="s4-rule"></div>
          <div id="s4-foot">666 Questions · Question 02 tomorrow</div>
        </div>
        <div id="fade" class="blackout"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ---------- ambient drift (all scenes) ---------- */
      tl.fromTo("#s1-glow", { scale: 0.9, opacity: 0.55 }, { scale: 1.18, opacity: 0.95, duration: 3.0, ease: "sine.inOut" }, 0);
      tl.fromTo("#s1-ghost", { y: 44 }, { y: -44, duration: 3.2, ease: "sine.inOut" }, 0);
      tl.fromTo("#s2-glow", { scale: 0.92, opacity: 0.5 }, { scale: 1.15, opacity: 0.9, duration: 3.3, ease: "sine.inOut" }, 3.25);
      tl.fromTo("#s3-glow", { scale: 0.9, opacity: 0.55 }, { scale: 1.16, opacity: 0.92, duration: 5.5, ease: "sine.inOut" }, 6.85);
      tl.fromTo("#s4-glow", { scale: 0.92, opacity: 0.5 }, { scale: 1.14, opacity: 0.9, duration: 3.4, ease: "sine.inOut" }, 12.45);

      /* ================= SCENE 1 · entrance ================= */
      tl.from("#s1-eyebrow", { y: 24, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.from("#s1-num", { scale: 0.7, opacity: 0, filter: "blur(18px)", duration: 0.9, ease: "expo.out" }, 0.35);
      tl.from("#s1-word", { y: 50, opacity: 0, duration: 0.7, ease: "expo.out" }, 0.62);
      tl.from("#s1-rule", { scaleX: 0, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.88);
      tl.from("#s1-sub", { y: 24, opacity: 0, duration: 0.6, ease: "power2.out" }, 1.02);

      /* ================= T1 · dip to black (3.0) ================= */
      tl.to("#scene1", { opacity: 0, duration: 0.25, ease: "power2.in" }, 3.0);
      tl.fromTo("#scene2", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 3.25);

      /* ================= SCENE 2 · entrance ================= */
      tl.from("#s2-lab", { x: -30, opacity: 0, duration: 0.5, ease: "power3.out" }, 3.7);
      tl.from("#s2-mark", { x: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 3.7);
      tl.from("#s2-kicker", { y: 30, opacity: 0, duration: 0.6, ease: "power3.out" }, 3.9);
      tl.from("#s2-q", { y: 60, opacity: 0, filter: "blur(12px)", duration: 0.9, ease: "expo.out" }, 4.05);
      tl.from("#s2-rule", { scaleX: 0, opacity: 0, duration: 0.6, ease: "power2.out" }, 4.55);

      /* ================= T2 · dip to black (6.6) ================= */
      tl.to("#scene2", { opacity: 0, duration: 0.25, ease: "power2.in" }, 6.6);
      tl.fromTo("#scene3", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 6.85);

      /* ================= SCENE 3 · word reveals ================= */
      tl.from("#s3-lab", { y: -20, opacity: 0, duration: 0.5, ease: "power3.out" }, 6.9);
      tl.from("#s3-mark", { y: -20, opacity: 0, duration: 0.5, ease: "power3.out" }, 7.0);
      tl.from("#w1", { x: -70, opacity: 0, filter: "blur(10px)", duration: 0.7, ease: "expo.out" }, 7.0);
      tl.from("#w2", { x: -70, opacity: 0, filter: "blur(10px)", duration: 0.7, ease: "expo.out" }, 7.75);
      tl.from("#w3", { x: -70, opacity: 0, filter: "blur(10px)", duration: 0.7, ease: "expo.out" }, 8.5);
      tl.from("#w4", { x: -70, opacity: 0, filter: "blur(10px)", duration: 0.8, ease: "back.out(1.4)" }, 9.25);

      /* ================= T3 · dip to black (12.2) ================= */
      tl.to("#scene3", { opacity: 0, duration: 0.25, ease: "power2.in" }, 12.2);
      tl.fromTo("#scene4", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 12.45);

      /* ================= SCENE 4 · CTA + final fade ================= */
      tl.from("#s4-kicker", { y: 26, opacity: 0, duration: 0.6, ease: "power3.out" }, 12.55);
      tl.from("#s4-text", { y: 50, opacity: 0, filter: "blur(10px)", duration: 0.8, ease: "expo.out" }, 12.7);
      tl.from("#s4-rule", { scaleX: 0, opacity: 0, duration: 0.5, ease: "power2.out" }, 13.15);
      tl.from("#s4-foot", { y: 20, opacity: 0, duration: 0.6, ease: "power3.out" }, 13.35);
      tl.to("#fade", { opacity: 1, duration: 0.7, ease: "power1.inOut" }, 15.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
